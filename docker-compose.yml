version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_work_memory_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_work_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_work_memory_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Work Memory
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_work_memory
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
